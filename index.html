<!DOCTYPE html>
<html lang="en">
<head>

<title>Kalyanam Kazhinjo? 💍</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#111;
    overflow:hidden;
}

button,
select,
input{
    font-family:inherit;
}

.setup{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#ff758c,#8e44ad);
}

.panel{
    width:100%;
    max-width:520px;
    background:white;
    padding:30px;
    border-radius:28px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.panel h1{
    text-align:center;
    margin-top:0;
    font-size:34px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

.field{
    margin-bottom:13px;
}

.field label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.field input,
.field select{
    width:100%;
    padding:13px;
    border:2px solid #eee;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

.field input:focus,
.field select:focus{
    border-color:#e84393;
}


.start-btn{
    width:100%;
    border:0;
    padding:15px;
    border-radius:14px;
    background:linear-gradient(135deg,#e84393,#8e44ad);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.game{
    display:none;
    position:fixed;
    inset:0;
    background:#78c8ef;
}

#scene{
    position:absolute;
    inset:0;
}

.topbar{
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    width:calc(100% - 24px);
    max-width:1000px;
    z-index:20;
    background:rgba(255,255,255,.93);
    border-radius:18px;
    padding:12px 16px;
    box-shadow:0 8px 30px rgba(0,0,0,.2);
}

.names{
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.status{
    text-align:center;
    margin-top:5px;
    font-weight:bold;
    color:#e84393;
}

.stats{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin-top:7px;
}

.stat{
    background:#f8e8f1;
    padding:5px 10px;
    border-radius:20px;
    font-size:13px;
}

.controls{
    position:absolute;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    width:calc(100% - 24px);
    max-width:1000px;
    z-index:20;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
}

.controls button{
    border:0;
    background:white;
    padding:18px 24px;
    border-radius:14px;
    font-weight:bold;
    font-size:17px;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.controls button:hover{
    transform:translateY(-2px);
}

.flash{
    position:fixed;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
    z-index:100;
    transition:opacity .12s;
}

.flash.active{
    opacity:1;
}

.popup{
    display:none;
    position:fixed;
    inset:0;
    z-index:90;
    background:rgba(0,0,0,.65);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.popup-box{
    width:100%;
    max-width:560px;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:24px;
    padding:25px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.popup-box h2{
    margin-top:0;
}

.popup-box button{
    border:0;
    background:#e84393;
    color:white;
    padding:11px 20px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
}

.photo{
    width:100%;
    border-radius:15px;
    display:block;
    margin:15px 0;
    border:4px solid #eee;
}

.certificate{
    border:7px double #c49a3a;
    padding:25px;
    background:#fffdf3;
    border-radius:10px;
}

.certificate h2{
    color:#9b751d;
}

.visa{
    border:3px solid #1f4c8c;
    border-radius:15px;
    padding:20px;
    background:linear-gradient(135deg,#edf5ff,#fff);
    text-align:left;
}

.visa-title{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    color:#1f4c8c;
}

.visa-approved{
    text-align:center;
    font-size:20px;
    color:#16834b;
    font-weight:bold;
    margin:10px;
}

.divorce{
    position:fixed;
    inset:0;
    z-index:120;
    display:none;
    background:#161616;
    color:white;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}

.divorce h1{
    font-size:45px;
}

.divorce button{
    border:0;
    padding:14px 25px;
    border-radius:12px;
    background:#e84393;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

@media(max-width:600px){

    .panel{
        padding:22px;
    }

    .panel h1{
        font-size:28px;
    }

    .names{
        font-size:18px;
    }

    .controls button{
        font-size:16px;
        padding:15px 18px;
    }

}

</style>
</head>

<script>

let scene;
let camera;
let renderer;

let yourPerson;
let crushPerson;
let photographer;

let guestsGroup;
let weddingObjects = [];

let weddingStarted = false;
let married = false;

let yourName = "";
let crushName = "";

let yourGender = "";
let crushGender = "";

let destination = "";
let honeymoonCountry = "";
let budget = 0;
let guestCount = 0;

let latestWeddingPhoto = null;
let photoBusy = false;

let confettiPieces = [];


// ======================================================
// BASIC HELPERS
// ======================================================

function money(n){

    return "₹" + Number(n).toLocaleString("en-IN");

}


function destinationName(){

    const names = {

        kerala:"Traditional Kerala 🥥",
        beach:"Beach 🌴",
        palace:"Royal Palace 👑",
        mountain:"Mountain ⛰️"

    };

    return names[destination];

}


function openPopup(title,content){

    document.getElementById("popupTitle").innerHTML=title;

    document.getElementById("popupContent").innerHTML=content;

    document.getElementById("popup").style.display="flex";

}


function closePopup(){

    document.getElementById("popup").style.display="none";

}


function destinationNameFor(value){

    const names = {
        kerala:"Traditional Kerala 🥥",
        beach:"Beach 🌴",
        palace:"Royal Palace 👑",
        mountain:"Mountain ⛰️"
    };

    return names[value] || value;
}


// ======================================================
// START WEDDING
// ======================================================

function startWedding(){

    yourName=document.getElementById("yourName").value.trim();

    crushName=document.getElementById("crushName").value.trim();

    if(!yourName) yourName="Anonymous";

    if(!crushName) crushName="My Crush";

    yourGender=document.getElementById("yourGender").value;

    crushGender=document.getElementById("crushGender").value;

    destination=document.getElementById("destination").value;
    honeymoonCountry=document.getElementById("honeymoonCountry").value;

    budget=Number(document.getElementById("budget").value);

    guestCount=Number(document.getElementById("guests").value);


    document.getElementById("setup").style.display="none";

    document.getElementById("game").style.display="block";


    document.getElementById("names").innerHTML=
        `${yourName} ❤️ ${crushName}`;


    document.getElementById("destinationStat").innerHTML=
        "📍 " + destinationName();


    document.getElementById("budgetStat").innerHTML=
        "💰 " + money(budget);


    document.getElementById("guestStat").innerHTML=
        "👥 " + guestCount + " Guests";

    document.getElementById("honeymoonStat").innerHTML=
        "✈️ " + honeymoonCountry;


    initThree();

}


// ======================================================
// THREE.JS
// ======================================================

function initThree(){

    scene=new THREE.Scene();

    scene.background=new THREE.Color(
        destination==="mountain"
        ?0x9ed7f2
        :0x79c8ed
    );


    camera=new THREE.PerspectiveCamera(
        60,
        window.innerWidth/window.innerHeight,
        .1,
        1000
    );

    camera.position.set(0,6,16);

    camera.lookAt(0,2,0);


    renderer=new THREE.WebGLRenderer({

        antialias:true,

        preserveDrawingBuffer:true

    });


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.shadowMap.enabled=true;

    renderer.shadowMap.type=THREE.PCFSoftShadowMap;


    document.getElementById("scene").appendChild(
        renderer.domElement
    );


    // LIGHTS

    const ambient=new THREE.AmbientLight(
        0xffffff,
        1.7
    );

    scene.add(ambient);


    const sun=new THREE.DirectionalLight(
        0xffffff,
        2
    );

    sun.position.set(8,15,10);

    sun.castShadow=true;

    scene.add(sun);


    createGround();

    createMandapam();

    createStringLights();

    createChairs();

    createCake();

    createGifts();

    createFlowers();

    createDestinationDecor();


    yourPerson=createPerson(
        yourGender,
        yourName,
        0xff80ab
    );

    crushPerson=createPerson(
        crushGender,
        crushName,
        0x7c9cff
    );


    yourPerson.position.set(-7,0,0);

    crushPerson.position.set(7,0,0);


    scene.add(yourPerson);

    scene.add(crushPerson);


    photographer=createPhotographer();

    scene.add(photographer);


    createGuests();


    weddingStarted=true;

    document.getElementById("status").innerHTML=
        "💒 The wedding is starting...";


    animate();

}


// ======================================================
// GROUND
// ======================================================

function createGround(){

    let color=0x75b85c;


    if(destination==="beach")
        color=0xe5d19b;

    if(destination==="kerala")
        color=0x70ad58;

    if(destination==="palace")
        color=0x858585;

    if(destination==="mountain")
        color=0x6b9b70;


    const ground=new THREE.Mesh(

        new THREE.PlaneGeometry(
            50,
            50
        ),

        new THREE.MeshStandardMaterial({
            color:color
        })

    );


    ground.rotation.x=-Math.PI/2;

    ground.receiveShadow=true;

    scene.add(ground);

}


// ======================================================
// PERSON
// ======================================================

function createPerson(gender,name,bodyColor){

    const group=new THREE.Group();


    const body=new THREE.Mesh(

        new THREE.CapsuleGeometry(
            .7,
            1.5,
            8,
            16
        ),

        new THREE.MeshStandardMaterial({
            color:bodyColor
        })

    );

    body.position.y=1.4;

    body.castShadow=true;

    group.add(body);


    const head=new THREE.Mesh(

        new THREE.SphereGeometry(
            .55,
            24,
            24
        ),

        new THREE.MeshStandardMaterial({
            color:0xffc69c
        })

    );

    head.position.y=2.9;

    head.castShadow=true;

    group.add(head);


    // hair

    const hair=new THREE.Mesh(

        new THREE.SphereGeometry(
            .57,
            24,
            16,
            0,
            Math.PI*2,
            0,
            Math.PI*.55
        ),

        new THREE.MeshStandardMaterial({
            color:gender==="girl"
                ?0x26130b
                :0x151515
        })

    );

    hair.position.y=3.12;

    group.add(hair);


    // eyes

    for(let x of [-.18,.18]){

        const eye=new THREE.Mesh(

            new THREE.SphereGeometry(
                .055,
                8,
                8
            ),

            new THREE.MeshBasicMaterial({
                color:0x111111
            })

        );

        eye.position.set(
            x,
            2.95,
            -.52
        );

        group.add(eye);

    }


    const label=createLabel(name);

    label.position.set(
        0,
        4,
        0
    );

    label.scale.set(
        3,
        .7,
        1
    );

    group.add(label);


    return group;

}


// ======================================================
// LABEL
// ======================================================

function createLabel(text){

    const canvas=document.createElement("canvas");

    canvas.width=700;

    canvas.height=160;


    const ctx=canvas.getContext("2d");

    ctx.fillStyle="rgba(255,255,255,.95)";

    ctx.beginPath();

    ctx.roundRect(
        15,
        15,
        670,
        130,
        35
    );

    ctx.fill();


    ctx.fillStyle="#35152f";

    ctx.font="bold 55px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        text,
        350,
        100
    );


    const texture=new THREE.CanvasTexture(canvas);


    const material=new THREE.SpriteMaterial({

        map:texture,

        transparent:true

    });


    return new THREE.Sprite(material);

}


// ======================================================
// MANDAPAM
// ======================================================

function createMandapam(){

    const floor=new THREE.Mesh(

        new THREE.BoxGeometry(
            12,
            .35,
            7
        ),

        new THREE.MeshStandardMaterial({
            color:0xc58a38
        })

    );


    floor.position.set(
        0,
        .2,
        -2
    );

    floor.receiveShadow=true;

    scene.add(floor);


    const positions=[

        [-5,-4],
        [5,-4],
        [-5,0],
        [5,0]

    ];


    positions.forEach(p=>{

        const pillar=new THREE.Mesh(

            new THREE.CylinderGeometry(
                .35,
                .45,
                5.5,
                16
            ),

            new THREE.MeshStandardMaterial({
                color:0xe7bd62
            })

        );


        pillar.position.set(
            p[0],
            3,
            p[1]
        );

        pillar.castShadow=true;

        scene.add(pillar);

    });


    const roof=new THREE.Mesh(

        new THREE.ConeGeometry(
            7,
            2.5,
            4
        ),

        new THREE.MeshStandardMaterial({
            color:0xb32655
        })

    );


    roof.position.set(
        0,
        6,
        -2
    );

    roof.rotation.y=Math.PI/4;

    scene.add(roof);


    const board=createLabel(
        "WELCOME TO THE BAD DECISION"
    );


    board.position.set(
        0,
        5,
        -3
    );

    board.scale.set(
        7,
        1.2,
        1
    );

    scene.add(board);

}


// ======================================================
// STRING LIGHTS
// ======================================================

function createStringLights(){

    for(let x=-9;x<=9;x+=1){

        const bulb=new THREE.Mesh(

            new THREE.SphereGeometry(
                .16,
                12,
                12
            ),

            new THREE.MeshStandardMaterial({

                color:0xffdf70,

                emissive:0xffa500,

                emissiveIntensity:2

            })

        );


        bulb.position.set(

            x,

            7+Math.sin(x)*.5,

            -4

        );


        scene.add(bulb);

    }

}


// ======================================================
// CHAIRS
// ======================================================

function createChairs(){

    for(let row=0;row<2;row++){

        for(let x=-8;x<=8;x+=2){

            const chair=new THREE.Mesh(

                new THREE.BoxGeometry(
                    .9,
                    .8,
                    .9
                ),

                new THREE.MeshStandardMaterial({
                    color:0x6e3d25
                })

            );


            chair.position.set(
                x,
                .4,
                4+row*2
            );


            scene.add(chair);

        }

    }

}


// ======================================================
// CAKE
// ======================================================

function createCake(){

    for(let i=0;i<3;i++){

        const cake=new THREE.Mesh(

            new THREE.CylinderGeometry(
                1.4-i*.25,
                1.4-i*.25,
                .75,
                32
            ),

            new THREE.MeshStandardMaterial({
                color:0xffedf6
            })

        );


        cake.position.set(
            -7,
            .6+i*.75,
            -4
        );


        cake.castShadow=true;

        scene.add(cake);

    }


    const topper=createLabel("♥");

    topper.position.set(
        -7,
        3,
        -4
    );

    topper.scale.set(
        1.2,
        1.2,
        1
    );

    scene.add(topper);

}


// ======================================================
// GIFTS
// ======================================================

function createGifts(){

    for(let i=0;i<8;i++){

        const gift=new THREE.Mesh(

            new THREE.BoxGeometry(
                .7,
                .7,
                .7
            ),

            new THREE.MeshStandardMaterial({

                color:new THREE.Color(
                    Math.random(),
                    Math.random(),
                    Math.random()
                )

            })

        );


        gift.position.set(
            -6+i*1.7,
            .4,
            6
        );


        scene.add(gift);

    }

}


// ======================================================
// FLOWERS
// ======================================================

function createFlowers(){

    for(let i=0;i<35;i++){

        const flower=new THREE.Mesh(

            new THREE.SphereGeometry(
                .22,
                10,
                10
            ),

            new THREE.MeshStandardMaterial({

                color:
                    i%2===0
                    ?0xff6fa8
                    :0xffffff

            })

        );


        flower.position.set(

            (Math.random()-.5)*20,

            .3,

            (Math.random()-.5)*14

        );


        scene.add(flower);

    }

}


// ======================================================
// DESTINATION DECOR
// ======================================================

function createDestinationDecor(){

    if(
        destination==="beach" ||
        destination==="kerala"
    ){

// ======================================================
// PALM
// ======================================================

function createPalm(x,z){

    const trunk=new THREE.Mesh(

        new THREE.CylinderGeometry(
            .25,
            .4,
            5
        ),

        new THREE.MeshStandardMaterial({
            color:0x76502f
        })

    );


    trunk.position.set(
        x,
        2.5,
        z
    );


    scene.add(trunk);


    for(let i=0;i<7;i++){

        const leaf=new THREE.Mesh(

            new THREE.ConeGeometry(
                .45,
                3,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x29884b
            })

        );


        leaf.position.set(

            x+
            Math.cos(i*Math.PI/3.5)*1.2,

            5,

            z+
            Math.sin(i*Math.PI/3.5)*1.2

        );


        leaf.rotation.z=
            Math.cos(i*Math.PI/3.5);


        scene.add(leaf);

    }

}


// ======================================================

function createPhotographer(){

    const group=new THREE.Group();


    const body=new THREE.Mesh(

        new THREE.CapsuleGeometry(
            .65,
            1.3,
            8,
            16
        ),

        new THREE.MeshStandardMaterial({
            color:0x222222
        })

    );

    body.position.y=1.3;

    group.add(body);


    const head=new THREE.Mesh(

        new THREE.SphereGeometry(
            .5,
            20,
            20
        ),

        new THREE.MeshStandardMaterial({
            color:0xffc69c
        })

    );

    head.position.y=2.65;

    group.add(head);


    // camera body

    const cameraBody=new THREE.Mesh(

        new THREE.BoxGeometry(
            .8,
            .55,
            .45
        ),

        new THREE.MeshStandardMaterial({
            color:0x111111
        })

    );


    cameraBody.position.set(
        0,
        1.6,
        -.75
    );


    group.add(cameraBody);


    const lens=new THREE.Mesh(

        new THREE.CylinderGeometry(
            .22,
            .22,
            .4,
            20
        ),

        new THREE.MeshStandardMaterial({
            color:0x555555
        })

    );


    lens.rotation.x=Math.PI/2;

    lens.position.set(
        0,
        1.6,
        -1
    );


    group.add(lens);


    const label=createLabel("📸 PHOTOGRAPHER");

    label.position.set(
        0,
        3.5,
        0
    );

    label.scale.set(
        2.7,
        .6,
        1
    );

    group.add(label);


    group.position.set(
        6,
        0,
        3
    );


    group.rotation.y=Math.PI;


    return group;

}


// ======================================================
// GUESTS
// ======================================================

function createGuests(){

    guestsGroup=new THREE.Group();

    const colors=[
        0xff8fab,
        0x8eb6ff,
        0xffcf70,
        0x9be28c,
        0xc7a5ff
    ];


    for(let i=0;i<guestCount;i++){

        const guest=new THREE.Group();


        const body=new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .35,
                .7,
                6,
                10
            ),

            new THREE.MeshStandardMaterial({
                color:colors[i%colors.length]
            })

        );


        body.position.y=.75;

        guest.add(body);


        const head=new THREE.Mesh(

            new THREE.SphereGeometry(
                .3,
                12,
                12
            ),

            new THREE.MeshStandardMaterial({
                color:0xffc69c
            })

        );


        head.position.y=1.6;

        guest.add(head);


        let columns=10;

        let row=Math.floor(i/columns);

        let col=i%columns;

        let startX=-(Math.min(
            guestCount,
            columns
        )-1)*.7/2;


        guest.position.set(

            startX+col*.7,

            0,

            5+row*1.3

        );


        guestsGroup.add(guest);

    }


    scene.add(guestsGroup);

}

// ======================================================
// WEDDING ANIMATION
// ======================================================

let weddingStartTime=0;

function animate(){

    requestAnimationFrame(animate);


    if(
        weddingStarted &&
        !married
    ){

        if(!weddingStartTime)
            weddingStartTime=Date.now();


        const elapsed=
            (Date.now()-weddingStartTime)/1000;


        const progress=
            Math.min(elapsed/5,1);


        yourPerson.position.x=
            -7 + 5.6*progress;


        crushPerson.position.x=
            7 - 5.6*progress;


        yourPerson.position.y=
            Math.abs(Math.sin(elapsed*8))*.05;


        crushPerson.position.y=
            Math.abs(Math.sin(elapsed*8+1))*.05;


        document.getElementById("status").innerHTML=
            progress<1
            ? "🚶 Walking towards destiny..."
            : "💍 MARRIED!!!";


        if(progress>=1){

            married=true;

            createRings();

            createConfetti();

            weddingAnnouncement();

            document.getElementById("status").innerHTML=
                "💍 MARRIED!!!";

        }

    }


    // confetti animation

    confettiPieces.forEach(piece=>{

        piece.position.y-=.025;

        piece.rotation.x+=.03;

        piece.rotation.z+=.02;


        if(piece.position.y<0){

            piece.position.y=
                Math.random()*10+5;

        }

    });


    // photographer idle animation

    if(photographer){

        photographer.position.y=
            Math.sin(Date.now()*.003)*.03;

    }


    renderer.render(
        scene,
        camera
    );

}

// ======================================================
// CAPTURE WEDDING PHOTO
// ======================================================

function captureWeddingPhoto(){

    // temporary camera position

    const oldPosition=
        camera.position.clone();


    const target=
        new THREE.Vector3(
            0,
            2.5,
            0
        );


    camera.position.set(
        0,
        5.2,
        15
    );


    camera.lookAt(target);


    renderer.render(
        scene,
        camera
    );


    latestWeddingPhoto=
        renderer.domElement.toDataURL(
            "image/png"
        );


    camera.position.copy(
        oldPosition
    );


    camera.lookAt(
        0,
        2,
        0
    );


    openPopup(

        "📸 WEDDING PHOTO",

        `
        <img
            class="photo"
            src="${latestWeddingPhoto}"
        >

        <p>
            📷 The photographer has cooked.
        </p>

        <p>
            ✨ Camera Flash!
        </p>

        <p>
            🎊 Confetti!
        </p>

        <p>
            <b>Number of photos taken: 847</b>
        </p>
        `

    );

}

// ======================================================
// RESIZE
// ======================================================

window.addEventListener(
    "resize",
    ()=>{

        if(!camera || !renderer)
            return;


        camera.aspect=
            window.innerWidth/
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);
