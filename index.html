<DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Oru Kalyanam Okke Vende??</title>
        <style>
            *{box-sizing: border-box}
            body{
                margin: 0;
                overflow-x: hidden;
                font-family: Arial, sans-serif;
                background:#160f20;
                color:white;
            }
            #setup{
                min-width: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
                background: linear-gradient(135deg, #ffafd2,#9181ff);
                overflow: auto;
            }
            .panel{
                width: min(520px,95%);
                background: white;
                color:#351d35;
                padding: 30px;
                border-radius: 30px;
                box-shadow: 0 20px 70px #0005;
            }
            .panel h1{
                text-align: center;
                margin: 5px;
                font-size: 42px;
            }
            .subtitle{
                text-align: center;
                opacity:.65;
                margin-bottom: 25px;
            }
            label{
                display: block;
                margin-top: 13px;
                font-weight: bold;
            }
            input, select{
                width: 100%;
                padding: 13px;
                margin-top: 5px;
                border-radius: 12px;
                border: 2px solid #e4b5d0;
                font-size: 16px;
            }
            .start{
                width: 100%;
                padding: 16px;
                margin-top: 22px;
                border-radius: 12px;
                border: 0;
                background: #ff4d94;
                color:white;
                font-weight: bold;
                cursor: pointer;
            }
            #game{
                display: none;
                width:100%;
                height:100vh;
            }
            #canvas-container{
                position: fixed;
                inset: 0;
            }
            #ui{
                position:fixed;
                inset: 0;
                pointer-events: none;
            }
            .top{
                text-align: center;
            }
        </style>
    </head>
