<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oru Kalyanam Okke Vende???💍</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow-x: hidden;
    font-family: Arial, sans-serif;
    background: #17111f;
    color: white;
}

#setup {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg,#ffb6d9,#8e7dff);
}

.panel {
    width: min(500px,95%);
    background: rgba(255,255,255,.95);
    color: #351d35;
    padding: 30px;
    border-radius: 30px;
    box-shadow: 0 20px 70px rgba(0,0,0,.3);
}

h1 {
    text-align: center;
    font-size: 42px;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    opacity: .65;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 14px;
}

input, select {
    width: 100%;
    padding: 13px;
    border: 2px solid #e3b6d1;
    border-radius: 12px;
    margin-top: 5px;
}

.start {
    width: 100%;
    margin-top: 25px;
    padding: 16px;
    border: 0;
    border-radius: 15px;
    background: #ff4d94;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
}

#game {
    display: none;
    width: 100%;
    min-height: 100vh;
}

#canvas-container {
    position: fixed;
    inset: 0;
}

#ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.title {
    text-align: center;
    padding-top: 20px;
    text-shadow: 0 3px 10px black;
}

.title h2 {
    margin: 0;
    font-size: 25px;
}

.status {
    margin-top: 5px;
}

.controls {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    pointer-events: auto;
}

.controls button {
    padding: 12px 16px;
    margin: 5px;
    border: 0;
    border-radius: 13px;
    font-weight: bold;
    cursor: pointer;
}

.photo {
    background: #8d7aff;
    color: white;
}

.disaster {
    background: #ff941f;
    color: white;
}

.certificate {
    background: #d4a72c;
    color: white;
}

.divorce {
    background: #444;
    color: white;
}

.popup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 20;
    pointer-events: auto;
}

.popup-box {
    width: min(520px,95%);
    background: white;
    color: #321c35;
    padding: 25px;
    border-radius: 25px;
    text-align: center;
    max-height: 90vh;
    overflow: auto;
}

.popup-box button {
    margin-top: 20px;
    border: 0;
    padding: 12px 25px;
    border-radius: 12px;
    background: #ff4d94;
    color: white;
    font-weight: bold;
}

.fake-photo {
    height: 220px;
    border-radius: 20px;
    background: linear-gradient(135deg,#ffc4df,#c8baff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 75px;
}

.cert {
    border: 8px double #bd9228;
    background: #fffbea;
    padding: 25px;
}

.cert h2 {
    color: #9b7300;
}

.disaster-text {
    font-size: 22px;
}

#divorceScreen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: #171717;
    color: white;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
}

#divorceScreen h1 {
    color: #ff6b9d;
}

.restart {
    border: 0;
    padding: 14px 22px;
    border-radius: 14px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- SETUP -->

<div id="setup">

<div class="panel">

<h1>💍</h1>

<h1>Oru Kalyanam Okke Vende???💍</h1>

<p class="subtitle">
The world's most unnecessary virtual wedding simulator.
</p>

<label>Your Name</label>
<input id="yourName" placeholder="Enter your name">

<label>Your Gender</label>
<select id="yourGender">
<option value="girl">Girl 👩</option>
<option value="boy">Boy 👨</option>
</select>

<label>Crush Name</label>
<input id="crushName" placeholder="Enter crush name">

<label>Crush Gender</label>
<select id="crushGender">
<option value="girl">Girl 👩</option>
<option value="boy">Boy 👨</option>
</select>

<label>Wedding Destination</label>
<select id="destination">
<option value="kerala">Traditional Kerala 🥥</option>
<option value="beach">Beach 🌴</option>
<option value="palace">Royal Palace 👑</option>
<option value="mountain">Mountain ⛰️</option>
</select>

<button class="start" onclick="startWedding()">
💒 START THE WEDDING
</button>

</div>
</div>


<!-- GAME -->

<div id="game">

<div id="canvas-container"></div>

<div id="ui">

<div class="title">

<h2>
<span id="display1"></span>
❤️
<span id="display2"></span>
</h2>

<div class="status">
Status:
<b id="status">Preparing...</b>
</div>

</div>

<div class="controls">

<button class="photo" onclick="weddingPhoto()">
📸 Wedding Photo
</button>

<button class="disaster" onclick="weddingDisaster()">
🚨 Wedding Disaster
</button>

<button class="certificate" onclick="showCertificate()">
📜 Certificate
</button>

<button class="divorce" onclick="divorce()">
💔 Divorce
</button>

</div>

</div>
</div>


<!-- POPUP -->

<div class="popup" id="popup">

<div class="popup-box">

<h2 id="popupTitle"></h2>

<div id="popupContent"></div>

<button onclick="closePopup()">
Okay 😂
</button>

</div>

</div>


<!-- DIVORCE -->

<div id="divorceScreen">

<div>

<h1>💔 DIVORCE COURT</h1>

<h2 id="divorceNames"></h2>

<p>
Marriage duration:
</p>

<h2>47 seconds 😭</h2>

<p>
After careful consideration,
the couple has decided...
</p>

<h2>
THIS WAS A TERRIBLE IDEA.
</h2>

<h3>Marriage Status: ❌ CANCELLED</h3>

<button class="restart" onclick="location.reload()">
🔄 Marry Someone Else
</button>

</div>

</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
   GLOBAL VARIABLES
========================= */

let scene;
let camera;
let renderer;

let person1;
let person2;

let clock = new THREE.Clock();

let weddingStarted = false;
let married = false;

let yourName = "";
let crushName = "";

let yourGender = "";
let crushGender = "";

let destination = "";


/* =========================
   START WEDDING
========================= */

function startWedding() {

yourName =
document.getElementById("yourName").value.trim();

crushName =
document.getElementById("crushName").value.trim();

yourGender =
document.getElementById("yourGender").value;

crushGender =
document.getElementById("crushGender").value;

destination =
document.getElementById("destination").value;


if (!yourName || !crushName) {

alert("Enter both names first 😭");

return;

}


document.getElementById("setup").style.display =
"none";

document.getElementById("game").style.display =
"block";

document.getElementById("display1").innerText =
yourName;

document.getElementById("display2").innerText =
crushName;


createWorld();

}


/* =========================
   CREATE WORLD
========================= */

function createWorld() {

scene = new THREE.Scene();

scene.background =
new THREE.Color(0x9bdcff);


/* CAMERA */

camera = new THREE.PerspectiveCamera(
55,
window.innerWidth / window.innerHeight,
0.1,
1000
);

camera.position.set(0,6,16);

camera.lookAt(0,2,0);


/* RENDERER */

renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.shadowMap.enabled = true;

document
.getElementById("canvas-container")
.appendChild(renderer.domElement);


/* LIGHT */

const ambient =
new THREE.AmbientLight(
0xffffff,
1.7
);

scene.add(ambient);


const sun =
new THREE.DirectionalLight(
0xffffff,
2
);

sun.position.set(
5,
12,
8
);

sun.castShadow = true;

scene.add(sun);


/* GROUND */

const groundGeometry =
new THREE.PlaneGeometry(
100,
100
);

const groundMaterial =
new THREE.MeshStandardMaterial({
color: getGroundColor()
});

const ground =
new THREE.Mesh(
groundGeometry,
groundMaterial
);

ground.rotation.x =
-Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* DESTINATION */

createDestination();


/* CHARACTERS */

person1 =
createPerson(
yourGender,
yourName,
-7
);

person2 =
createPerson(
crushGender,
crushName,
7
);

scene.add(person1);
scene.add(person2);


/* START ANIMATION */

weddingStarted = true;

document.getElementById("status").innerText =
"🚶 Walking...";


animate();

}


/* =========================
   GROUND COLORS
========================= */

function getGroundColor() {

if(destination === "beach")
return 0xe6d18a;

if(destination === "mountain")
return 0x91c78a;

if(destination === "palace")
return 0xcab4d9;

return 0xd9c28d;

}


/* =========================
   CREATE CHARACTER
========================= */

function createPerson(gender,name,x) {

const group =
new THREE.Group();


/* BODY */

const bodyGeometry =
new THREE.CapsuleGeometry(
0.75,
1.7,
8,
16
);

const bodyMaterial =
new THREE.MeshStandardMaterial({

color:
gender === "girl"
? 0xe34d91
: 0x4775d1

});

const body =
new THREE.Mesh(
bodyGeometry,
bodyMaterial
);

body.position.y = 2;

body.castShadow = true;

group.add(body);


/* HEAD */

const headGeometry =
new THREE.SphereGeometry(
0.65,
24,
24
);

const headMaterial =
new THREE.MeshStandardMaterial({
color:0xf2b28d
});

const head =
new THREE.Mesh(
headGeometry,
headMaterial
);

head.position.y = 3.7;

head.castShadow = true;

group.add(head);


/* HAIR */

const hairGeometry =
new THREE.SphereGeometry(
0.68,
24,
24
);

const hairMaterial =
new THREE.MeshStandardMaterial({
color:0x302027
});

const hair =
new THREE.Mesh(
hairGeometry,
hairMaterial
);

hair.scale.set(
1,
gender === "girl" ? 1.2 : .65,
1
);

hair.position.y =
gender === "girl"
? 4.05
: 4.15;

hair.castShadow = true;

group.add(hair);


/* EYES */

const eyeMaterial =
new THREE.MeshStandardMaterial({
color:0x111111
});

for(let i=-1;i<=1;i+=2) {

const eye =
new THREE.Mesh(
new THREE.SphereGeometry(
0.07,
10,
10
),
eyeMaterial
);

eye.position.set(
i*.22,
3.75,
.6
);

group.add(eye);

}


/* LEGS */

const legMaterial =
new THREE.MeshStandardMaterial({
color:
gender === "girl"
? 0x8c2859
: 0x242b45
});

for(let i=-1;i<=1;i+=2) {

const leg =
new THREE.Mesh(
new THREE.CapsuleGeometry(
0.18,
0.9,
6,
10
),
legMaterial
);

leg.position.set(
i*.3,
.35,
0
);

leg.castShadow = true;

group.add(leg);

}


/* LABEL */

const label =
createLabel(name);

label.position.y = 5.1;

group.add(label);


/* POSITION */

group.position.x = x;

return group;

}


/* =========================
   NAME LABEL
========================= */

function createLabel(text) {

const canvas =
document.createElement("canvas");

canvas.width = 512;
canvas.height = 128;

const ctx =
canvas.getContext("2d");

ctx.fillStyle =
"rgba(255,255,255,.9)";

ctx.roundRect(
30,
20,
452,
88,
25
);

ctx.fill();

ctx.fillStyle =
"#351d35";

ctx.font =
"bold 42px Arial";

ctx.textAlign =
"center";

ctx.fillText(
text,
256,
78
);

const texture =
new THREE.CanvasTexture(canvas);

const material =
new THREE.SpriteMaterial({
map:texture,
transparent:true
});

const sprite =
new THREE.Sprite(material);

sprite.scale.set(
3.2,
.8,
1
);

return sprite;

}


/* =========================
   DESTINATION
========================= */

function createDestination() {

if(destination === "beach") {

createPalm(-7,0,-3);
createPalm(7,0,-3);

}

if(destination === "kerala") {

createPalm(-7,0,-3);
createPalm(7,0,-3);

createArch();

}

if(destination === "palace") {

createColumns();

}

if(destination === "mountain") {

createMountain(-5,-2);
createMountain(0,-1);
createMountain(5,-2);

}

}


/* =========================
   PALM TREE
========================= */

function createPalm(x,y,z) {

const trunk =
new THREE.Mesh(
new THREE.CylinderGeometry(
.25,
.4,
4
),
new THREE.MeshStandardMaterial({
color:0x80532f
})
);

trunk.position.set(
x,
2,
z
);

scene.add(trunk);


const leaves =
new THREE.Mesh(
new THREE.SphereGeometry(
1.7,
12,
12
),
new THREE.MeshStandardMaterial({
color:0x3e9e55
})
);

leaves.scale.y = .4;

leaves.position.set(
x,
4.4,
z
);

scene.add(leaves);

}


/* =========================
   MOUNTAINS
========================= */

function createMountain(x,y) {

const mountain =
new THREE.Mesh(
new THREE.ConeGeometry(
3,
5,
4
),
new THREE.MeshStandardMaterial({
color:0x7b9b78
})
);

mountain.position.set(
x,
2,
-7
);

scene.add(mountain);

}


/* =========================
   PALACE
========================= */

function createColumns() {

for(let x=-7;x<=7;x+=3.5) {

const column =
new THREE.Mesh(
new THREE.CylinderGeometry(
.4,
.4,
6
),
new THREE.MeshStandardMaterial({
color:0xe5c86b
})
);

column.position.set(
x,
3,
-4
);

scene.add(column);

}

}


/* =========================
   KERALA ARCH
========================= */

function createArch() {

const arch =
new THREE.Mesh(
new THREE.TorusGeometry(
3,
.35,
12,
40,
Math.PI
),
new THREE.MeshStandardMaterial({
color:0xd29b42
})
);

arch.position.set(
0,
4,
-3
);

scene.add(arch);

}


/* =========================
   ANIMATION
========================= */

function animate() {

requestAnimationFrame(
animate
);

if(weddingStarted && !married) {

if(person1.position.x < -1.4)
person1.position.x += .025;

if(person2.position.x > 1.4)
person2.position.x -= .025;


if(
person1.position.x >= -1.4 &&
person2.position.x <= 1.4
) {

married = true;

document.getElementById("status").innerText =
"💍 MARRIED";

createRings();

setTimeout(
createConfetti,
300
);

}

}


renderer.render(
scene,
camera
);

}


/* =========================
   RINGS
========================= */

function createRings() {

const ringMaterial =
new THREE.MeshStandardMaterial({
color:0xffd23f,
metalness:.8,
roughness:.2
});

const ring1 =
new THREE.Mesh(
new THREE.TorusGeometry(
.35,
.08,
16,
32
),
ringMaterial
);

const ring2 =
ring1.clone();


ring1.position.set(
-.8,
3,
0
);

ring2.position.set(
.8,
3,
0
);

scene.add(ring1);
scene.add(ring2);


setTimeout(() => {

ring1.position.y = 4;
ring2.position.y = 4;

},500);

}


/* =========================
   CONFETTI
========================= */

function createConfetti() {

for(let i=0;i<80;i++) {

const geometry =
new THREE.BoxGeometry(
.12,
.12,
.12
);

const material =
new THREE.MeshStandardMaterial({
color:
Math.random()*0xffffff
});

const piece =
new THREE.Mesh(
geometry,
material
);

piece.position.set(
(Math.random()-.5)*16,
Math.random()*8+3,
(Math.random()-.5)*8
);

scene.add(piece);

fallConfetti(piece);

}

}


function fallConfetti(piece) {

let speed =
.02 + Math.random()*.05;

function fall() {

piece.position.y -= speed;

piece.rotation.x += .05;

piece.rotation.z += .04;

if(piece.position.y > -1)
requestAnimationFrame(fall);

}

fall();

}


/* =========================
   PHOTO
========================= */

function weddingPhoto() {

openPopup(

"📸 OFFICIAL WEDDING PHOTO",

`
<div class="fake-photo">
💐💍👩‍❤️‍👨💍💐
</div>

<h2>
${yourName} ❤️ ${crushName}
</h2>

<p>
The photographer has officially
made this unnecessarily dramatic.
</p>
`

);

}


/* =========================
   DISASTERS
========================= */

const disasters = [

"The groom forgot the ring. Everyone is pretending it was planned.",

"Random uncle has taken over the wedding stage.",

"The photographer requested the 63rd couple pose.",

"The wedding cake has disappeared.",

"Someone's mother asked: 'So... when are the kids coming?' 😭",

"The priest forgot what happens next.",

"Wedding budget suddenly became ₹87 crore.",

"Someone's chappal has disappeared.",

"The DJ started a completely unrelated song.",

"The wedding photographer has fallen into the decoration.",

"Everyone has arrived except the person getting married."

];


function weddingDisaster() {

let disaster =
disasters[
Math.floor(
Math.random()*disasters.length
)
];


openPopup(

"🚨 WEDDING DISASTER",

`
<div class="disaster-text">
💥 ${disaster}
</div>
`

);

}


/* =========================
   CERTIFICATE
========================= */

function showCertificate() {

openPopup(

"📜 MARRIAGE CERTIFICATE",

`
<div class="cert">

<h2>
CERTIFICATE OF
<br>
COMPLETELY UNNECESSARY MARRIAGE
</h2>

<br>

<p>This certifies that</p>

<h2>
${yourName} ❤️ ${crushName}
</h2>

<p>
have been virtually married.
</p>

<br>

<p>Wedding Destination</p>

<b>
${destination.toUpperCase()}
</b>

<br><br>

<p>Status</p>

<b>
Unfortunately Married 😂
</b>

<br><br>

<small>
This certificate has absolutely
NO legal value.
</small>

</div>
`

);

}


/* =========================
   POPUP
========================= */

function openPopup(
title,
content
) {

document.getElementById(
"popupTitle"
).innerText = title;

document.getElementById(
"popupContent"
).innerHTML = content;

document.getElementById(
"popup"
).style.display = "flex";

}


function closePopup() {

document.getElementById(
"popup"
).style.display = "none";

}


/* =========================
   DIVORCE
========================= */

function divorce() {

document.getElementById(
"divorceNames"
).innerText =
yourName +
" ❤️ " +
crushName;

document.getElementById(
"divorceScreen"
).style.display =
"flex";

}


/* =========================
   RESIZE
========================= */

window.addEventListener(
"resize",
() => {

if(!camera || !renderer)
return;

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});

</script>

</body>
</html>
